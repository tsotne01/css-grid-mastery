<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#gradient)"/>
  
  <!-- Grid pattern -->
  <g fill="white" opacity="0.95">
    <!-- Top row -->
    <rect x="60" y="60" width="120" height="120" rx="15"/>
    <rect x="196" y="60" width="120" height="120" rx="15"/>
    <rect x="332" y="60" width="120" height="120" rx="15"/>
    
    <!-- Middle row -->
    <rect x="60" y="196" width="120" height="120" rx="15"/>
    <rect x="196" y="196" width="120" height="120" rx="15"/>
    <rect x="332" y="196" width="120" height="120" rx="15"/>
    
    <!-- Bottom row -->
    <rect x="60" y="332" width="120" height="120" rx="15"/>
    <rect x="196" y="332" width="120" height="120" rx="15"/>
    <rect x="332" y="332" width="120" height="120" rx="15"/>
  </g>
</svg>
